name: kemoshow
description: "Slideshow viewer for Kemono-type websites."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  dart_mappable: ^4.10.0
  flutter:
    sdk: flutter
  http: ^1.6.0
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  dart_mappable_builder: ^4.10.0
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
