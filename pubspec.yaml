name: kemoshow
description: "Slideshow viewer for Kemono-type websites."
publish_to: "none"
version: 1.2.0

environment:
  sdk: ^3.12.2

dependencies:
  dart_mappable: ^4.10.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_file_dialog: ^3.3.3
  gal: ^2.3.3
  http: ^1.6.0
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  dart_mappable_builder: ^4.10.0
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
